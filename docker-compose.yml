services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-study-buddy-app
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - PORT=${PORT:-8000}
      - APP_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=rag_study_buddy
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-local-development-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=1440
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=llama-3.3-70b-versatile
      - FAISS_INDEX_PATH=/app/data/faiss_index
      - DOCUMENT_STORAGE_PATH=/app/data/documents
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - RETRIEVER_TOP_K=3
      - RAG_MAX_CONTEXT_CHARS=4000
      - CHAT_HISTORY_LIMIT=10
      - MAX_CHUNKS_PER_DOCUMENT=5000
      - RATE_LIMIT_ENABLED=true
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      - ./data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: rag-study-buddy-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongodb_data:
